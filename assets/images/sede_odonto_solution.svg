<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Céu Crepúsculo / Golden Hour Tecnológico -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Estrelas e Partículas Sutis -->
  <circle cx="120" cy="80" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="280" cy="50" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="450" cy="110" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="680" cy="70" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="750" cy="130" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Edifício Corporativo Principal da Odonto Solution -->
  <!-- Torre Esquerda -->
  <polygon points="120,500 120,220 300,160 300,500" fill="url(#wallGrad)"/>
  <!-- Fachada de Vidro Espelhada Central -->
  <polygon points="280,500 280,120 540,80 540,500" fill="url(#glassGrad)" stroke="#34d399" stroke-width="1.5"/>

  <!-- Janelas Iluminadas na Fachada -->
  <g fill="#a7f3d0" opacity="0.85">
    <rect x="300" y="150" width="40" height="25" rx="3"/>
    <rect x="360" y="140" width="40" height="25" rx="3"/>
    <rect x="420" y="130" width="40" height="25" rx="3"/>
    <rect x="480" y="120" width="40" height="25" rx="3"/>

    <rect x="300" y="200" width="40" height="25" rx="3"/>
    <rect x="360" y="190" width="40" height="25" rx="3"/>
    <rect x="420" y="180" width="40" height="25" rx="3"/>
    <rect x="480" y="170" width="40" height="25" rx="3"/>

    <rect x="300" y="250" width="40" height="25" rx="3"/>
    <rect x="360" y="240" width="40" height="25" rx="3"/>
    <rect x="420" y="230" width="40" height="25" rx="3"/>
    <rect x="480" y="220" width="40" height="25" rx="3"/>

    <rect x="300" y="300" width="40" height="25" rx="3"/>
    <rect x="360" y="290" width="40" height="25" rx="3"/>
    <rect x="420" y="280" width="40" height="25" rx="3"/>
    <rect x="480" y="270" width="40" height="25" rx="3"/>

    <rect x="300" y="350" width="40" height="25" rx="3"/>
    <rect x="360" y="340" width="40" height="25" rx="3"/>
    <rect x="420" y="330" width="40" height="25" rx="3"/>
    <rect x="480" y="320" width="40" height="25" rx="3"/>
  </g>

  <!-- Asa Direita do Edifício -->
  <polygon points="540,500 540,180 700,240 700,500" fill="url(#wallGrad)"/>

  <!-- Letreiro Luminoso da Odonto Solution no Topo -->
  <g transform="translate(300, 75)" filter="url(#glowGreen)">
    <rect width="220" height="35" rx="8" fill="#047857" fill-opacity="0.8" stroke="#10b981" stroke-width="2"/>
    <text x="110" y="24" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1">ODONTO SOLUTION</text>
  </g>

  <!-- Hall de Entrada / Térreo em Vidro com Luz Interna Quente -->
  <polygon points="240,500 240,430 580,410 580,500" fill="#fef08a" fill-opacity="0.35" stroke="#fde047" stroke-width="1.5"/>
  <rect x="370" y="440" width="80" height="60" rx="4" fill="#047857" fill-opacity="0.9" stroke="#34d399" stroke-width="2"/>
  <text x="410" y="475" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="12" fill="#ffffff">RECEPÇÃO</text>

  <!-- Piso / Calçada e Paisagismo com Iluminação LED Verde -->
  <rect x="0" y="500" width="800" height="100" fill="#0f172a"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#10b981" stroke-width="4" filter="url(#glowGreen)"/>

  <!-- Jardins e Palmeiras Iluminadas -->
  <g fill="#059669">
    <ellipse cx="160" cy="520" rx="40" ry="15" fill="#065f46"/>
    <ellipse cx="640" cy="520" rx="45" ry="15" fill="#065f46"/>
  </g>

  <!-- Placa comemorativa no solo -->
  <g transform="translate(60, 480)">
    <rect width="180" height="60" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#glowGreen)"/>
    <text x="90" y="26" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="12" fill="#ffffff">SEDE CORPORATIVA</text>
    <text x="90" y="46" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="10" fill="#34d399">São Paulo · Hub de Saúde</text>
  </g>
</svg>